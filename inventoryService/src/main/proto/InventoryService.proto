syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.some.grpc.inventory";

service InventoryService {
  rpc checkAvailability (ProductRequestDto) returns (ProductResponseDto);
}

message ProductRequestDto {
  string id = 1;
  int64 quantity = 2;
}

message ProductResponseDto {
  string id = 1;
  string name = 2;
  int64 quantity = 3;
  int64 price_pennies = 4;
  int64 sale_pennies = 5;
}