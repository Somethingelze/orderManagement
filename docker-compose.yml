services:
  discovery-server:
    build: ./discovery-server
    ports:
      - "8761:8761"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8761/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  users-db:
    image: postgres:15
    container_name: users-db
    ports:
      - "5431:5432"
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

  products-db:
    image: postgres:15
    container_name: products-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: products_db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

  orders-db:
    image: postgres:15
    container_name: orders-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: orders_db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka-1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      CLUSTER_ID: '5L6g3nShT-eMCtK--X86sw'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG4J_LOGGERS: "org.apache.kafka.image.loader.MetadataLoader=WARN,org.apache.kafka.queue.KafkaEventQueue=WARN,kafka.server.MetadataLoader=WARN"

  auth-service:
    build: ./auth-service
    ports:
      - "8083:8083"
    env_file:
      - auth-service/.env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://users-db:5432/users_db
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
    depends_on:
      - discovery-server
      - users-db

  inventory-service:
    build: ./inventory-service
    ports:
      - "8081:8081"
      - "9090:9090"
    env_file:
      - inventory-service/.env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://products-db:5432/products_db
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
    depends_on:
      - discovery-server
      - products-db

  order-service:
    build: ./order-service
    ports:
      - "8080:8080"
    env_file:
      - order-service/.env
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - discovery-server
      - kafka
      - inventory-service

  notification-service:
    build: ./notification-service
    ports:
      - "8082:8082"
    env_file:
      - notification-service/.env
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - discovery-server
      - orders-db
      - kafka

  api-gateway:
    build: ./api-gateway
    ports:
      - "8084:8084"
    env_file:
      - api-gateway/.env
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
    depends_on:
      discovery-server:
        condition: service_healthy